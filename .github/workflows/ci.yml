name: ROS checks

on: [push, pull_request]

permissions:
  contents: read

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
  COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR02 and PR03 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Test PR03 command selection and package style
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test -v
          ros2 pkg executables patrol | grep -Fx 'patrol patrol'

      - name: Validate PR01 environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null

      - name: Download pinned course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Check PR02 evidence at its submission commit
        shell: bash
        run: |
          git worktree add --detach /tmp/pr02-submission "$(git log -1 --format=%H -- evidence/pr02/report.json)"
          python3 .course-kit/v1/tools/check_practice.py PR02 --submission /tmp/pr02-submission

      - name: Check PR03 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR03 --submission .
