name: ROS checks

on: [push, pull_request]

permissions:
  contents: read

env:
  LEGACY_COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
  LEGACY_COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522

  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
  ROS_DOMAIN_ID: 16
  ROS_LOG_DIR: /tmp/ros-ci-logs

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ROS packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/patrol.launch.py"
          ros2 launch course_bringup patrol.launch.py --show-args

      - name: Test parameters, sensor QoS, full launch and package style
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
          ros2 pkg executables patrol | grep -Fx 'patrol patrol'
          ros2 pkg executables patrol | grep -Fx 'patrol pose_relay'
          ros2 pkg executables patrol | grep -Fx 'patrol pose_subscriber'

      - name: Validate PR01 environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null

      - name: Download pinned course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit/legacy
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit
          curl -fsSLo /tmp/legacy-kit.tar.gz "$LEGACY_COURSE_KIT_URL"
          printf '%s  %s\n' "$LEGACY_COURSE_KIT_SHA256" /tmp/legacy-kit.tar.gz | sha256sum -c -
          tar -xzf /tmp/legacy-kit.tar.gz -C .course-kit/legacy

      - name: Check PR02 evidence at its submission commit
        shell: bash
        run: |
          git worktree add --detach /tmp/pr02-submission "$(git log -1 --format=%H -- evidence/pr02/report.json)"
          python3 .course-kit/legacy/v1/tools/check_practice.py PR02 --submission /tmp/pr02-submission

      - name: Check PR03 evidence at its submission commit
        shell: bash
        run: |
          git worktree add --detach /tmp/pr03-submission "$(git log -1 --format=%H -- evidence/pr03/report.json)"
          python3 .course-kit/legacy/v1/tools/check_practice.py PR03 --submission /tmp/pr03-submission

      - name: Check PR04 evidence at its submission commit
        shell: bash
        run: |
          git worktree add --detach /tmp/pr04-submission "$(git log -1 --format=%H -- evidence/pr04/report.json)"
          python3 .course-kit/v1/tools/check_practice.py PR04 --submission /tmp/pr04-submission

      - name: Check PR05 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
